name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  home-manager-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: kohei-darwin
          - os: ubuntu-latest
            target: kohei-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build Home Manager configuration
        run: nix build .#homeConfigurations.${{ matrix.target }}.activationPackage
