name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  home-manager-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: kohei-darwin
          - os: ubuntu-latest
            target: kohei-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Test bootstrap, agent hooks, and Observatory
        run: |
          nix shell --inputs-from . nixpkgs#bash nixpkgs#jq nixpkgs#python311 --command bash -euc '
            bash script/tests/test-bootstrap.sh
            bash script/tests/test-agent-hooks.sh
            python3 script/tests/test-observatory.py
          '
      - name: Build Home Manager configuration
        run: nix build .#homeConfigurations.${{ matrix.target }}.activationPackage
