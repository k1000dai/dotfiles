repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  # nixfmt / shellcheck are provided by home.nix (nix backend)
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        args: [-x]
        language: system
        files: \.sh$
        exclude: ^\.zsh/git-prompt\.sh$
